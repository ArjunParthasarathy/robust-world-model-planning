defaults:
  - _self_

hydra:
  run:
    dir: plan_outputs/pusht_sweep/${now:%Y%m%d%H%M%S}

ckpt_path: ./outputs/pusht/
model_epoch: latest

seed: 99
n_evals: 50
goal_source: 'dset'
goal_H: 5
n_plot_samples: 0

debug_dset_init: False

wandb_project: pusht_sweep

objective:
  _target_: planning.objectives.create_objective_fn
  alpha: 1
  base: 2
  mode: all

planner:
  _target_: planning.mpc.MPCPlanner
  max_iter: 10
  n_taken_actions: 1
  save_video: false
  sub_planner:
    action_noise: 0.003
    eval_every: 80
    horizon: 5
    lr: 0.2
    opt_steps: 100
    optimizer_type: adam
    rollout_type: custom
    sample_type: randn
    target: planning.gd.GDPlanner
  name: mpc_gd_sweep
